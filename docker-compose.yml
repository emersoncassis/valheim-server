services:
  valheim:
    image: lloesche/valheim-server:latest
    container_name: ${VALHEIM_CONTAINER:-valheim-server}
    restart: unless-stopped
    stop_grace_period: 2m
    cap_add:
      - sys_nice
    volumes:
      - ./data/config:/config
      - ./data/server:/opt/valheim
    ports:
      # O manual oficial diz: o Valheim usa a porta escolhida E porta+1.
      # Padrão 2456-2457. A 2458 que muitos tutoriais mandam abrir não é
      # usada pelo jogo — abrir porta à toa é superfície de ataque de graça.
      - "${VALHEIM_PORT:-2456}:${VALHEIM_PORT:-2456}/udp"
      - "${VALHEIM_PORT_1:-2457}:${VALHEIM_PORT_1:-2457}/udp"
    environment:
      SERVER_NAME: ${VALHEIM_SERVER_NAME:-Meu Servidor Valheim}
      WORLD_NAME: ${VALHEIM_WORLD_NAME:-Dedicated}
      # Sem valor padrão de propósito: senha nunca tem default.
      # Se vier vazia, a própria imagem do Valheim recusa subir e diz isso
      # no log. Não usamos ${VAR:?} aqui porque isso quebra na interpolação
      # do compose — antes de existir container, log ou terminal pra debugar
      # (atrapalha deploy em PaaS, tipo Dokploy).
      SERVER_PASS: ${VALHEIM_SERVER_PASS:-}
      SERVER_PORT: ${VALHEIM_PORT:-2456}
      SERVER_PUBLIC: ${VALHEIM_PUBLIC:-false}
      ADMINLIST_IDS: ${VALHEIM_ADMIN_IDS:-}
      TZ: ${TZ:-America/Sao_Paulo}
      # Backup nativo da imagem desligado: usamos o nosso, com rotação.
      BACKUPS: "false"
      # Argumentos passados direto pro valheim_server, conforme o manual
      # oficial. Duas coisas entram aqui:
      #
      # -saveinterval N : de quanto em quanto tempo o mundo é gravado em
      #   disco (padrão do jogo: 1800s = 30 min). Importa pro backup, que
      #   copia o que está NO DISCO — com o padrão, um backup pode estar
      #   até meia hora atrasado. 600s é um meio-termo; salvar com muita
      #   frequência causa micro-travadas no jogo.
      #
      # -crossplay : preenchido por scripts/start.sh a partir de
      #   VALHEIM_CROSSPLAY. No Dokploy (que não roda o script), defina
      #   VALHEIM_CROSSPLAY_ARG=-crossplay direto nas variáveis.
      SERVER_ARGS: -saveinterval ${VALHEIM_SAVE_INTERVAL:-600} ${VALHEIM_CROSSPLAY_ARG:-}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f valheim_server.x86_64 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

  panel:
    build: ./panel
    container_name: valheim-panel
    restart: unless-stopped
    ports:
      # Externa configurável; interna sempre 8080 (é onde o Node escuta).
      - "${PANEL_PORT:-9091}:8080"
    volumes:
      # Controla o container do Valheim.
      - /var/run/docker.sock:/var/run/docker.sock
      # Lê mundo e escreve backups.
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      # Sem default de propósito — senha e segredo nunca têm valor padrão.
      # Vazio faz o preflight() do painel recusar subir e dizer exatamente
      # o que falta, no log do container. Ver comentário em SERVER_PASS
      # sobre por que não usamos ${VAR:?} aqui.
      PANEL_USER: ${PANEL_USER:-}
      PANEL_PASS: ${PANEL_PASS:-}
      PANEL_SESSION_SECRET: ${PANEL_SESSION_SECRET:-}
      PANEL_SESSION_HOURS: ${PANEL_SESSION_HOURS:-12}
      VALHEIM_CONTAINER: ${VALHEIM_CONTAINER:-valheim-server}
      VALHEIM_WORLD_NAME: ${VALHEIM_WORLD_NAME:-Dedicated}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_MAX_AGE_DAYS: ${BACKUP_MAX_AGE_DAYS:-30}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      - valheim
